<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل الدخول | وادي بناء للنقل الدولي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-darkbg text-zinc-100 min-h-screen" data-module="login">
  <main class="login-page">
    <section class="login-card" aria-labelledby="lgTitle">
      <div class="login-brand">
        <div class="login-brand-mark"><img src="assets/images/wadi-bina-logo.jpeg" alt="شعار وادي بناء"></div>
        <strong>وادي بناء للنقل الدولي</strong>
        <span class="login-kicker">بوابة العمليات والمركز المالي</span>
      </div>
      <div class="login-form-wrap">
        <span class="login-secure"><i class="fa-solid fa-shield-halved ml-1"></i> دخول آمن</span>
        <h1 id="lgTitle" class="text-2xl font-black text-white mt-3">تسجيل الدخول للنظام</h1>
        <p id="lgSub" class="text-zinc-400 text-sm mt-1">سجّل الدخول للمتابعة عبر أقسام النظام</p>
        <p id="cloudInitError" class="hidden text-red-400 text-xs mt-3" role="alert"></p>
        <form onsubmit="handleLogin(event)" class="mt-5">
          <label for="loginUser" class="block text-xs font-bold text-zinc-300 mb-2">البريد الإلكتروني</label>
          <div class="login-field mb-4"><i class="fa-solid fa-envelope"></i><input id="loginUser" type="email" autocomplete="email" required placeholder="name@swd.ae"></div>
          <label for="loginPass" class="block text-xs font-bold text-zinc-300 mb-2">كلمة المرور</label>
          <div class="login-field mb-6"><i class="fa-solid fa-lock"></i><input id="loginPass" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
          <button id="lgBtn" type="submit" class="login-submit w-full gold-gradient-bg text-black font-extrabold py-3.5 rounded-xl">دخول النظام <i class="fa-solid fa-arrow-left mr-2"></i></button>
        </form>
        <p class="text-center text-zinc-400 text-xs mt-4">لتغيير كلمة المرور، سجّل الدخول ثم استخدم زر «كلمة المرور» داخل النظام.</p>
      </div>
    </section>
  </main>
  <script type="module" src="assets/js/module-shell.js"></script>
</body>
</html>
